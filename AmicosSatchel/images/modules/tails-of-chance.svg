<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512">
  <!-- Tails of Chance feature image: "Crystal Board". Source for images/modules/tails-of-chance.png. -->
  <defs>
    <symbol id="crystal" viewBox="0 0 160 380">
      <polygon points="80,0 0,140 80,380 160,140" fill="#4fb4f0"/>
      <polygon points="80,0 0,140 80,160" fill="#fff" opacity=".28"/>
      <polygon points="80,0 80,160 160,140" fill="#fff" opacity=".6"/>
      <polygon points="0,140 80,160 80,380" fill="#000" opacity=".08"/>
      <polygon points="80,160 160,140 80,380" fill="#000" opacity=".3"/>
    </symbol>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8fd8ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8fd8ff" stop-opacity="0"/>
    </radialGradient>
    <g id="seal-empty"><polygon points="0,-36 28,0 0,36 -28,0" fill="#16204a" stroke="#c9a24a" stroke-width="4"/></g>
    <g id="seal-lit"><use xlink:href="#crystal" href="#crystal" x="-28" y="-40" width="56" height="80"/></g>
  </defs>

  <rect width="512" height="512" rx="104" fill="#0e1636"/>
  <rect x="22" y="22" width="468" height="468" rx="86" fill="none" stroke="#c9a24a" stroke-width="8"/>
  <rect x="40" y="40" width="432" height="432" rx="70" fill="none" stroke="#c9a24a" stroke-width="2" opacity=".7"/>

  <use href="#seal-empty" xlink:href="#seal-empty" transform="translate(206 106)"/>
  <use href="#seal-empty" xlink:href="#seal-empty" transform="translate(306 106)"/>
  <use href="#seal-empty" xlink:href="#seal-empty" transform="translate(406 106)"/>
  <use href="#seal-empty" xlink:href="#seal-empty" transform="translate(106 206)"/>
  <use href="#seal-empty" xlink:href="#seal-empty" transform="translate(306 206)"/>
  <use href="#seal-empty" xlink:href="#seal-empty" transform="translate(406 206)"/>
  <use href="#seal-empty" xlink:href="#seal-empty" transform="translate(106 306)"/>
  <use href="#seal-empty" xlink:href="#seal-empty" transform="translate(206 306)"/>
  <use href="#seal-empty" xlink:href="#seal-empty" transform="translate(406 306)"/>
  <use href="#seal-empty" xlink:href="#seal-empty" transform="translate(106 406)"/>
  <use href="#seal-empty" xlink:href="#seal-empty" transform="translate(206 406)"/>
  <use href="#seal-empty" xlink:href="#seal-empty" transform="translate(306 406)"/>

  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>
  <line x1="106" y1="106" x2="406" y2="406" stroke="#bfeaff" stroke-width="6" stroke-linecap="round" opacity=".8"/>

  <use href="#seal-lit" xlink:href="#seal-lit" transform="translate(106 106)"/>
  <use href="#seal-lit" xlink:href="#seal-lit" transform="translate(206 206)"/>
  <use href="#seal-lit" xlink:href="#seal-lit" transform="translate(306 306)"/>
  <use href="#seal-lit" xlink:href="#seal-lit" transform="translate(406 406)"/>
</svg>
