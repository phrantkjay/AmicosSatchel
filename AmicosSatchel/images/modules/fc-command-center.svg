<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- FC Command Center feature image: a company crest with a crystal and a banner.
       Source for images/modules/fc-command-center.png (128x128). Same palette as the plugin icon. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="50%">
      <stop offset="0" stop-color="#8fd8ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8fd8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d68f"/>
      <stop offset="1" stop-color="#c9a24a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="#0e1636"/>
  <rect x="22" y="22" width="468" height="468" rx="86" fill="none" stroke="#c9a24a" stroke-width="8"/>
  <rect x="40" y="40" width="432" height="432" rx="70" fill="none" stroke="#c9a24a" stroke-width="2" opacity=".7"/>

  <circle cx="256" cy="236" r="190" fill="url(#glow)"/>

  <!-- Crest -->
  <path d="M256 92 L384 132 L384 248 C384 330 326 384 256 414 C186 384 128 330 128 248 L128 132 Z"
        fill="#16204a" stroke="url(#gold)" stroke-width="14" stroke-linejoin="round"/>
  <path d="M256 120 L360 152 L360 248 C360 314 314 360 256 386 C198 360 152 314 152 248 L152 152 Z"
        fill="none" stroke="#c9a24a" stroke-width="3" opacity=".6"/>

  <!-- Crystal -->
  <g transform="translate(256 252)">
    <polygon points="0,-112 -52,-34 0,92 52,-34" fill="#4fb4f0"/>
    <polygon points="0,-112 -52,-34 0,-24" fill="#fff" opacity=".28"/>
    <polygon points="0,-112 0,-24 52,-34" fill="#fff" opacity=".6"/>
    <polygon points="-52,-34 0,-24 0,92" fill="#000" opacity=".08"/>
    <polygon points="0,-24 52,-34 0,92" fill="#000" opacity=".3"/>
  </g>

  <!-- Banner -->
  <path d="M96 352 L156 338 L156 398 L96 412 L116 382 Z" fill="#a3202b"/>
  <path d="M416 352 L356 338 L356 398 L416 412 L396 382 Z" fill="#a3202b"/>
  <path d="M146 330 Q256 360 366 330 L366 392 Q256 422 146 392 Z" fill="#c9343f" stroke="url(#gold)" stroke-width="6" stroke-linejoin="round"/>
  <g fill="#f0d68f">
    <circle cx="214" cy="378" r="9"/>
    <circle cx="256" cy="384" r="9"/>
    <circle cx="298" cy="378" r="9"/>
  </g>
</svg>
